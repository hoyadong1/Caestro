plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.drivesoundtrack.app'
    compileSdk 37
    defaultConfig {
        applicationId 'com.drivesoundtrack.app'
        minSdk 28
        targetSdk 34
        versionCode 29
        versionName '0.12.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { compose true }
    testOptions {
        unitTests {
            // Screenshot tests render the Compose screen on the JVM (Robolectric) and need resources.
            includeAndroidResources = true
            all { systemProperty 'roborazzi.test.record', 'true' }
        }
    }
}

def localSdkProperties = new Properties()
def localSdkFile = rootProject.file('local.properties')
if (localSdkFile.exists()) localSdkFile.withInputStream { localSdkProperties.load(it) }
def sdkRoot = System.getenv('ANDROID_SDK_ROOT') ?: System.getenv('ANDROID_HOME') ?: localSdkProperties.getProperty('sdk.dir')
if (!sdkRoot) throw new GradleException('Set ANDROID_SDK_ROOT or sdk.dir in local.properties')

def localSigningProperties = new Properties()
def localSigningFile = rootProject.file('signing.properties')
if (localSigningFile.exists()) localSigningFile.withInputStream { localSigningProperties.load(it) }
if (localSigningFile.exists()) {
    android.signingConfigs {
        release {
            storeFile rootProject.file(localSigningProperties.getProperty('storeFile'))
            storePassword localSigningProperties.getProperty('storePassword')
            keyAlias localSigningProperties.getProperty('keyAlias')
            keyPassword localSigningProperties.getProperty('keyPassword')
        }
    }
    android.buildTypes.release.signingConfig = android.signingConfigs.release
}

dependencies {
    compileOnly files("${sdkRoot}/platforms/android-37.0/optional/android.car.jar")
    implementation 'ai.pleos.playground:Vehicle:2.3.2'

    implementation platform('androidx.compose:compose-bom:2025.10.01')
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation platform('androidx.compose:compose-bom:2025.10.01')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    testImplementation 'org.robolectric:robolectric:4.16'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi:1.46.1'
    testImplementation 'io.github.takahirom.roborazzi:roborazzi-compose:1.46.1'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
